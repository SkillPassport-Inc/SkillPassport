name: SkillPassport CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Frontend Web Application Build & Test
  web-build:
    name: Build & Validate Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Production Web Bundle
        run: npm run build

  # 2. Python FastAPI AI Engine Validation
  python-ai-service:
    name: Validate Python AI Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'services/ai-service/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-service/requirements.txt

      - name: Lint Python Code
        run: |
          python -m py_compile services/ai-service/main.py

  # 3. Java Spring Boot Service Validation
  java-backend-service:
    name: Validate Java Spring Boot Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Java Spring Boot Service
        working-directory: services/backend-service
        run: |
          mvn clean compile -DskipTests
