# Dependabot configuration file for SkillPassport
version: 2
updates:
  # 1. Maintain JavaScript / npm root dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "javascript"

  # 2. Maintain Python AI Service dependencies
  - package-ecosystem: "pip"
    directory: "/services/ai-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"

  # 3. Maintain Java Spring Boot Backend Service dependencies
  - package-ecosystem: "maven"
    directory: "/services/backend-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "java"

  # 4. Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "ci/cd"
