# SkillPassport Java Backend Service Configuration

# Spring Boot Server Port
server.port=8081

# Supabase PostgreSQL JDBC Connection
# Host: db.iilzuhcqikvhnwfjcvoa.supabase.co
# Port: 5432
# Database: postgres
# Username: postgres
spring.datasource.url=jdbc:postgresql://db.iilzuhcqikvhnwfjcvoa.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD:YOUR-PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
